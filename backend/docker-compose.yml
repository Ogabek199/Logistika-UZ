# Lokal dev uchun Postgres (production bilan bir xil provayder)
# Ishga tushirish: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistika
      POSTGRES_PASSWORD: logistika
      POSTGRES_DB: logistika
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
